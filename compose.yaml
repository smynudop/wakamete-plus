name: wakamete-plus

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-development-root-password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-wakamete}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-wakamete}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-development-password}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host localhost --authenticationDatabase admin -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --eval 'db.runCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:
